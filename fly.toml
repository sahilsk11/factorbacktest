app = "factorbacktest"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[deploy]
  # Run pending DB migrations before the new app version takes traffic. Fly
  # runs this in a temp VM with full app secrets injected (FB_SECRETS_FROM_ENV
  # gives the binary the same db creds the API uses). A non-zero exit aborts
  # the release, so a broken migration leaves prod on the previous version
  # rather than half-migrated.
  release_command = "/app/migrate"

[env]
  FB_SECRETS_FROM_ENV = "1"
  GIN_MODE = "release"
  # Supercronic reads TZ when it starts and schedules the crontab in this
  # timezone. The runtime image includes tzdata for DST-aware ET scheduling.
  TZ = "America/New_York"

  # Public base URL of the Go API (Cloudflare orange-cloud in front of
  # this Fly app). internal/auth uses this as the OAuth redirect_uri host
  # (APP_BASE_URL + /auth/google/callback) and as the issuer on internal
  # tokens. Fly custom cert is CLI-managed, not in this file:
  #   fly certs add factor-api.ultron.sh -a factorbacktest
  # api.factor.trade can keep serving until its DNS is cut; dual-host is
  # fine once both certs exist. FACTOR_AUTH_FRONTEND_BASE_URL stays the
  # browser origin - do not point it at the API host.
  APP_BASE_URL = "https://factor-api.ultron.sh"
  # Where the Google OAuth callback redirects on success. Must match the FE
  # origin (where users come from). The auth package never accepts a
  # redirect target from query params; this env var is the only way to
  # change it.
  FACTOR_AUTH_FRONTEND_BASE_URL = "https://factor.trade"

[processes]
  web = "/app/api"
  cron = "supercronic /app/crontab"

[http_service]
  internal_port = 3009
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one web machine warm so factor.trade landing does not pay a ~2s
  # cold-start on GET /publishedStrategies (warm TTFB ~250–360ms). We pay
  # for one always-on web VM instead of scale-to-zero on the marketing API.
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    method = "get"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# Per-process sizes: web stays at shared-cpu-2x / 1gb (always-on landing
# API). Cron is supercronic + curl, so a smaller VM is enough. Both
# [[vm]] blocks must name their process group; a bare [[vm]] would apply
# to every group and would resize web too.
[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["cron"]
